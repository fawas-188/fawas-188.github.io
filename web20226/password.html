<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>password</title>
    <link rel="stylesheet" href="mystyle.css">
<script>
    function validateForm()
    {
        var firstname =document.forms["form1"]["firstname"].value;
        var lastname =document.forms["form1"]["lastname"].value;
        var password1 =document.forms["form1"]["password1"].value;
        var password2 =document.forms["form1"]["password2"].value;
        var email =document.forms["form1"]["email"].value;
        if (firstname==null  || firstname=="")
    {
        alert("PlS Enter your Name")
        return false

    }
    if (lastname==null  || lastname=="")
    {
        alert("PlS Enter your LastName")
        return false

    }
    if (password1!=password2  || password1=="")
    {
        alert("password do not match")
        return false;
    }
    var foundAt = 0;
    var foundDot = 0;
    for (i=0;i<email.length;i++)
    {
        if (email[i]=="@"){foundAt=i;}
        if (email[i]=="."){foundDot=i;}
    }
    if (foundAt>1 && foundDot>foundAt+3&&foundDot<email.length-2)
    {
        return true;
    }
    else
    {
        alert("invalid email")
        return false;
    }

        return false;
    }
</script>    
</head>
<body>
    <h3>Register</h3>
    <strong>
        <form name="form1" action="home.html" onsubmit="return validateForm()">
            <p>FirstName: <input type="text" id="firstname" name="username" placeholder="Pls Enter your FirstName" value=""></p>
            <p>lastName: <input type="text" id="lastname" name="username" placeholder="PlS Enter your LastName" value=""></p>
            <p>Email: <input type="text" id="email" name="email" placeholder="Pls Enter your E-Mail" value="" ></p>
            <p>Password: <input type="password" id="password1" placeholder="Pls Enter your Password" ></p>
            <p>confirm password: <input type="password" id="password2" placeholder="Pls confirm password" ></p>
            <input type="submit" id="submit">
        </form>
    </strong>
</body>
</html>
