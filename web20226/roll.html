<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎲 Dice Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#0ea5e9);
    font-family:Arial, sans-serif;
    color:white;
}

h1{
    font-size:4rem;
    margin-bottom:30px;
    text-shadow:0 0 10px white,
                0 0 20px #00e5ff;
}

.dice-container{
    display:flex;
    gap:50px;
    margin-bottom:30px;
}

.dice{
    font-size:120px;
}

.roll-left{
    animation:rollLeft 1s ease;
}

.roll-right{
    animation:rollRight 1s ease;
}
.roll-center{
    animation: rollcenter 1s ease;
}

@keyframes rollLeft{
    0%{
        transform:rotate(0deg) scale(1);
    }
    50%{
        transform:rotate(360deg) scale(1.3);
    }
    100%{
        transform:rotate(720deg) scale(1);
    }
}

@keyframes rollRight{
    0%{
        transform:rotate(0deg) scale(1);
    }
    50%{
        transform:rotate(-360deg) scale(1.3);
    }
    100%{
        transform:rotate(-720deg) scale(1);
    }
}

button{
    padding:15px 35px;
    font-size:1.2rem;
    font-weight:bold;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:linear-gradient(45deg,#00e5ff,#8b5cf6);
    color:white;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
    box-shadow:0 0 20px #00e5ff;
}

button:active{
    transform:scale(0.95);
}
</style>
</head>

<body>

<h1>🎲 Dice Game 🎲</h1>

<div class="dice-container">
    <div id="dice1" class="dice">⚀</div>
    <div id="dice2" class="dice">⚀</div>
    <div id="dice3" class="dice">⚀</div>
</div>

<button id="rollBtn">🎲 Roll Dice</button>

<script>

const diceFaces = ["⚀","⚁","⚂","⚃","⚄","⚅"];

document.getElementById("rollBtn").addEventListener("click", () => {

    let dice1 = document.getElementById("dice1");
    let dice2 = document.getElementById("dice2");
    let dice3 = document.getElementById("dice3");

    dice1.classList.add("roll-left");
    dice2.classList.add("roll-right");
    dice3.classList.add("roll-center");

    setTimeout(() => {

        let random1 = Math.floor(Math.random() * 6);
        let random2 = Math.floor(Math.random() * 6);
        let random3 = Math.floor(Math.random() * 4);

        dice1.textContent = diceFaces[random1];
        dice2.textContent = diceFaces[random2];
        dice3.textContent = diceFaces[random3];

        dice1.classList.remove("roll-left");
        dice2.classList.remove("roll-right");
        dice3.classList.remove("roll-left");

    }, 1000);

});

</script>

</body>
</html>
